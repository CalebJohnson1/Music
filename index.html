<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <script src="musicPlayer.js"></script>
    <link href="src/styles.css" rel="stylesheet">
</head>

<body class="bg-slate-900 min-h-screen flex items-center justify-center">
    <!-- Settings -->
     <div class="absolute top-2 right-3 text-white">
        <button id="settings-icon" onclick="showSettingsList()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <ul class="absolute top-8 right-0 bg-slate-800 rounded-lg shadow-lg min-w-[150px]" id="settings-list" hidden>
            <li class="px-2 py-1 hover: cursor-pointer">Appearance</li>
        </ul>
     </div>

    <!-- Volume Bar -->
    <div class="absolute bottom-0 right-3">
        <button id="volume-icon" onclick="muteAudio()">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
        </button>
        <input type="range" id="volume-slider" min="0" max="100" value="50"
            class="accent-[#2A220F]">
    </div>

    <!-- Track List -->
    <ul id="music-file" class="absolute grid justify-items-start left-0 top-0 bottom-0 overflow-y-auto text-white" hidden></ul>
    
    <!-- Music Player Controls -->
    <div id="music-container" class="absolute bottom-0 items-center justify-center text-white">
        <input type="file" accept="audio/*" id="audio-input" class="hidden" webkitdirectory multiple>
        <label for="audio-input" class="cursor-pointer">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 22h.5a2 2 0 0 0 2-2V7l-5-5H6a2 2 0 0 0-2 2v3"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M2 19a2 2 0 1 1 4 0v1a2 2 0 1 1-4 0v-4a6 6 0 0 1 12 0v4a2 2 0 1 1-4 0v-1a2 2 0 1 1 4 0"/></svg>
        </label>
        <audio id="player">
            Your browser does not support the audio element.
        </audio>
        <div class="music-controls flex justify-center">
            <button onclick="previousTrack()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13.971 4.285A2 2 0 0 1 17 6v12a2 2 0 0 1-3.029 1.715l-9.997-5.998a2 2 0 0 1-.003-3.432z"/><path d="M21 20V4"/></svg>
            </button>
            <button onclick="playPauseMusic()" id="playPauseButton">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a2 2 0 0 1 3.008-1.728l11.997 6.998a2 2 0 0 1 .003 3.458l-12 7A2 2 0 0 1 5 19z"/></svg>        
            </button>
            <button>
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.029 4.285A2 2 0 0 0 7 6v12a2 2 0 0 0 3.029 1.715l9.997-5.998a2 2 0 0 0 .003-3.432z"/><path d="M3 4v16"/></svg>
            </button>
        </div>
        <p id="song-title"></p>
        <div class="flex justify-between gap-1">
            <p id="time"></p>
            <input type="range" id="progress-bar" min="0" max="100" value="0" step="0.1" 
                class="w-full accent-[#2A220F]" hidden>
            <p id="song-duration"></p>
        </div>
    </div>
</body>
</html>
